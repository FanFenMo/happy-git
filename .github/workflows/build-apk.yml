name: Build & Release Android APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install Client Dependencies
        run: |
          cd client
          npm ci

      - name: Build Web Assets
        env:
          VITE_API_BASE_URL: ${{ vars.HAPPYGIT_API_BASE_URL }}
        run: |
          cd client
          npm run build:release

      - name: Sync Capacitor Android
        run: |
          cd client
          npx cap sync android

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build Android Debug APK
        run: |
          cd client/android
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Organize Output APK
        run: |
          mkdir -p output
          cp client/android/app/build/outputs/apk/debug/app-debug.apk output/HappyGit-v1.0.0.apk

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: HappyGit-v1.0.0-Android-APK
          path: output/HappyGit-v1.0.0.apk
          if-no-files-found: error

  build-windows:
    name: Build Windows Client
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install Client Dependencies
        working-directory: client
        run: npm ci

      - name: Build Windows Client
        working-directory: client
        env:
          VITE_API_BASE_URL: ${{ vars.HAPPYGIT_API_BASE_URL }}
        run: npm run build:win

      - name: Organize Windows Archive
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path output | Out-Null
          Compress-Archive -LiteralPath client/release/HappyGit-win-x64 -DestinationPath output/HappyGit-v1.0.0-win-x64.zip

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HappyGit-v1.0.0-Windows
          path: output/HappyGit-v1.0.0-win-x64.zip
          if-no-files-found: error

  publish:
    name: Publish Clients
    needs: [build-android, build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
    steps:
      - name: Download Client Artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: HappyGit-v1.0.0-*
          path: output
          merge-multiple: true

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-alpha
          name: "HappyGit v1.0.0 跨平台客户端预发布 (含 Android APK)"
          body: |
            ### 📱 HappyGit v1.0.0 客户端下载
            
            - **Android 安装包**: 点击下方 `HappyGit-v1.0.0.apk` 即可直接在安卓手机上安装体验。
            - **Windows 桌面端**: 下载 `HappyGit-v1.0.0-win-x64.zip`，完整解压后运行 `HappyGit.exe`。
            - 授权服务地址已随安装包预置，用户无需填写服务地址或应用凭据。
            
            #### 🌟 本版功能特色：
            - GitHub 账号登录与公开项目画像同步
            - 类抖音风格个人主页与多维技术标签展示
            - 浏览历史与 Star 记录管理
            - 热门项目卡片流预告
          files: |
            output/HappyGit-v1.0.0.apk
            output/HappyGit-v1.0.0-win-x64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
