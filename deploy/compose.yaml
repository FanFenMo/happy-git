services:
  api:
    build:
      context: ../server
    restart: unless-stopped
    environment:
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:?请配置项目的 GitHub Client ID}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:?请配置项目的 GitHub Client Secret}
      GITHUB_CALLBACK_URL: https://${HAPPYGIT_DOMAIN:?请配置项目的域名}/api/auth/github/callback
      GITHUB_APP_TYPE: ${GITHUB_APP_TYPE:-oauth-app}
    expose:
      - "8081"

  proxy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - api
    environment:
      HAPPYGIT_DOMAIN: ${HAPPYGIT_DOMAIN:?请配置项目的域名}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
