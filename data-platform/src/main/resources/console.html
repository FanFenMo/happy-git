<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HappyGit 数据工作台</title>
<style>
:root{--color-bg-canvas:#f5f7fa;--color-bg-surface:#fff;--color-bg-subtle:#eef2f7;--color-text-primary:#18283e;--color-text-secondary:#53637a;--color-text-tertiary:#66758b;--color-brand-primary:#315ee7;--color-brand-subtle:#edf2ff;--color-border-subtle:rgba(207,217,232,.7);--color-status-success:#26744a;--color-status-success-bg:#eaf6ee;--color-status-warning:#935d13;--color-status-warning-bg:#fff4df;--color-status-danger:#ad3944;--color-status-danger-bg:#fdf0f0;--radius-control:6px;--radius-panel:12px;--space-2:8px;--space-4:16px;--space-6:24px}
*{box-sizing:border-box}body{margin:0;background:var(--color-bg-canvas);color:var(--color-text-primary);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft Yahei",sans-serif}button,input,select{font:inherit}button,a,input,select{outline-offset:3px}a{color:var(--color-brand-primary);text-decoration:none}button{border:1px solid var(--color-border-subtle);border-radius:var(--radius-control);background:var(--color-bg-surface);padding:8px 14px;color:var(--color-text-secondary);cursor:pointer}button:disabled{cursor:wait;opacity:.6}button.primary{background:var(--color-brand-primary);color:var(--color-bg-surface);border-color:var(--color-brand-primary)}input,select{border:1px solid var(--color-border-subtle);border-radius:var(--radius-control);padding:9px 12px;background:var(--color-bg-surface);color:var(--color-text-primary);max-width:100%}label{display:flex;flex-direction:column;gap:6px;color:var(--color-text-secondary)}.shell{display:grid;grid-template-columns:216px minmax(0,1fr);min-height:100vh}.side{background:var(--color-bg-surface);border-right:1px solid var(--color-border-subtle);padding:28px 20px;display:flex;flex-direction:column;gap:28px}.brand{font-size:21px;font-weight:700;letter-spacing:-.5px}.brand span{color:var(--color-brand-primary)}.side small{color:var(--color-text-tertiary)}.nav{display:grid;gap:6px}.nav button{text-align:left;border:0;padding:11px 14px}.nav button.active{color:var(--color-brand-primary);background:var(--color-brand-subtle);font-weight:600}.side-foot{margin-top:auto;display:grid;gap:10px}.workspace{min-width:0;padding:32px 36px;max-width:1560px;width:100%;margin:0 auto}.topline{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:28px}.eyebrow{font-size:12px;color:var(--color-text-tertiary);letter-spacing:1px}h1{font-size:24px;line-height:32px;letter-spacing:-.5px;margin:4px 0 0}h2{font-size:16px;margin:0}p{margin:8px 0}.muted{color:var(--color-text-secondary)}.auth{display:flex;gap:8px;align-items:end;flex-wrap:wrap}.auth label{font-size:12px}.auth input{width:190px}.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin-bottom:24px}.metric{background:var(--color-bg-surface);border:1px solid var(--color-border-subtle);border-radius:var(--radius-panel);padding:20px}.metric span{color:var(--color-text-secondary);font-size:12px}.metric strong{display:block;font-size:30px;font-weight:600;margin-top:10px;font-variant-numeric:tabular-nums}.notice{border:1px solid var(--color-border-subtle);border-radius:var(--radius-panel);padding:14px 18px;margin:0 0 20px;background:var(--color-bg-surface);color:var(--color-text-secondary)}.notice.warning{background:var(--color-status-warning-bg);color:var(--color-status-warning)}.filters{display:flex;align-items:end;gap:12px;flex-wrap:wrap;margin:0 0 20px}.filters .search{flex:1;min-width:180px}.filters label{font-size:12px}.panel{background:var(--color-bg-surface);border:1px solid var(--color-border-subtle);border-radius:var(--radius-panel);min-width:0}.panel-head{padding:20px 24px;border-bottom:1px solid var(--color-border-subtle);display:flex;align-items:center;justify-content:space-between;gap:16px}.table-wrap{overflow:auto}table{border-collapse:collapse;width:100%;white-space:nowrap}th,td{padding:14px 20px;text-align:left;border-bottom:1px solid var(--color-border-subtle)}th{font-size:12px;font-weight:500;color:var(--color-text-secondary);background:var(--color-bg-canvas)}tr:last-child td{border-bottom:0}td.number,th.number{text-align:right;font-variant-numeric:tabular-nums}td.time,th.time{text-align:right;color:var(--color-text-secondary);font-size:12px}.badge{display:inline-flex;gap:5px;align-items:center;padding:3px 9px;font-size:12px;background:var(--color-brand-subtle);color:var(--color-brand-primary);border-radius:9999px}.badge.succeeded{color:var(--color-status-success);background:var(--color-status-success-bg)}.badge.failed{color:var(--color-status-danger);background:var(--color-status-danger-bg)}.badge.queued{color:var(--color-text-secondary);background:var(--color-bg-subtle)}.empty{text-align:center;padding:64px 24px}.empty strong{font-size:16px;display:block;margin-bottom:8px}.empty p{color:var(--color-text-secondary)}.row-detail{padding:16px 24px;white-space:normal}.row-detail pre{max-height:320px;overflow:auto;background:var(--color-bg-canvas);padding:16px;white-space:pre-wrap;overflow-wrap:anywhere;font:12px/1.6 monospace}summary{cursor:pointer;color:var(--color-brand-primary)}.pager{padding:16px 24px;display:flex;align-items:center;justify-content:space-between;color:var(--color-text-secondary)}.pager>div{display:flex;align-items:center;gap:12px}.collect{margin-top:24px;padding:24px;display:grid;grid-template-columns:1fr auto;gap:16px;align-items:end}.collect h2{grid-column:1/-1}.collect p{grid-column:1/-1}.catalog{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}.project{background:var(--color-bg-surface);border:1px solid var(--color-border-subtle);border-radius:var(--radius-panel);padding:24px;display:flex;flex-direction:column;gap:14px;min-width:0}.project .owner{font-size:12px;color:var(--color-text-tertiary)}.project h2{font-size:18px;overflow-wrap:anywhere}.project p{min-height:42px;color:var(--color-text-secondary)}.tags{display:flex;flex-wrap:wrap;gap:6px}.tag{font-size:12px;padding:3px 8px;border-radius:4px;background:var(--color-bg-subtle);color:var(--color-text-secondary)}.project footer{display:flex;justify-content:space-between;gap:12px;border-top:1px solid var(--color-border-subtle);padding-top:14px;margin-top:auto;color:var(--color-text-secondary);font-size:12px}.project details{border-top:1px solid var(--color-border-subtle);padding-top:12px}.project dl{display:grid;grid-template-columns:92px minmax(0,1fr);font-size:12px;gap:8px}.project dt{color:var(--color-text-secondary)}.project dd{margin:0;overflow-wrap:anywhere}.radio-group{display:flex;gap:0}.radio-group button{border-radius:0}.radio-group button:first-child{border-radius:6px 0 0 6px}.radio-group button:last-child{border-radius:0 6px 6px 0}.radio-group button.selected{background:var(--color-brand-subtle);color:var(--color-brand-primary)}[hidden]{display:none!important}.statusline{min-height:24px;color:var(--color-text-secondary);font-size:12px}.mobile-nav{display:none}
@media(min-width:1400px){.catalog{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(max-width:900px){.shell{grid-template-columns:176px minmax(0,1fr)}.workspace{padding:24px 20px}.side{padding:24px 12px}.topline{align-items:start;flex-direction:column}.metrics{grid-template-columns:repeat(2,minmax(0,1fr))}.catalog{grid-template-columns:1fr}}
@media(max-width:600px){.shell{display:block}.side{display:none}.workspace{padding:20px 16px 80px}.topline{margin-bottom:22px}.metrics{gap:10px}.metric{padding:16px}.metric strong{font-size:26px}.collect{grid-template-columns:1fr}.collect button{min-height:44px}.collect h2,.collect p{grid-column:auto}.panel-head{padding:18px 16px}.mobile-nav{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:space-around;gap:8px;padding:12px;background:var(--color-bg-surface);border-top:1px solid var(--color-border-subtle)}.mobile-nav a{padding:4px 16px}.auth{width:100%}.auth input{width:150px}.project{padding:20px}.pager{padding:14px 16px}}
</style></head><body><div class="shell"><aside class="side"><div><div class="brand">Happy<span>Git</span></div><small id="brand-caption">数据工作台</small></div><nav class="nav" id="nav"></nav><div class="side-foot"><small>Hadoop · 数据处理平台</small><a href="/client">查看客户端新设计 ↗</a></div></aside>
<main class="workspace"><header class="topline"><div><div class="eyebrow" id="eyebrow">DATA OPERATIONS</div><h1 id="title">采集与处理</h1></div><form class="auth" id="auth"><label>管理员凭据<input id="token" type="password" autocomplete="off" placeholder="本机可不填写"></label><button type="submit" id="refresh">刷新数据</button></form></header><div class="statusline" id="status" role="status" aria-live="polite"></div>
<section id="admin"><div class="metrics"><div class="metric"><span>采集进程在线</span><strong id="workers">—</strong></div><div class="metric"><span>等待处理</span><strong id="queued">—</strong></div><div class="metric"><span>正在执行</span><strong id="running">—</strong></div><div class="metric"><span>已完成任务</span><strong id="succeeded">—</strong></div></div><div class="notice" id="cluster-mode">正在读取部署模式</div>
<div class="filters"><label class="search">搜索任务<input id="search" type="search" placeholder="项目、任务编号或执行主机"></label><label>任务状态<select id="state"><option value="">全部状态</option><option value="queued">等待处理</option><option value="running">正在执行</option><option value="succeeded">已完成</option><option value="failed">执行失败</option></select></label><label>每页条数<select id="page-size"><option>10</option><option>20</option><option>50</option></select></label></div>
<section class="panel"><header class="panel-head"><h2 id="section-title">任务列表</h2><span class="muted" id="total">—</span></header><div id="data-region"></div><footer class="pager" id="pager"><span id="page-caption"></span><div><button id="previous" aria-label="上一页">上一页</button><button id="next" aria-label="下一页">下一页</button></div></footer></section>
<form class="panel collect" id="collect"><h2>采集公开项目</h2><label>GitHub 项目<input id="repository" required pattern="[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+" placeholder="apache/hadoop"></label><button class="primary" id="submit" type="submit">创建采集任务</button><p class="muted" id="submit-status" role="status"></p></form></section>
<section id="client" hidden><div class="notice warning">这是已采集的公开项目目录。正式个人画像尚未接入，不将目录顺序标为个性化推荐。</div><div class="filters"><label class="search">发现开源项目<input id="project-search" type="search" placeholder="项目名称、技术标签或用途"></label><label>浏览方式<div class="radio-group"><button type="button" class="selected" data-sort="catalog">公开目录</button><button type="button" data-sort="stars">社区关注</button><button type="button" data-sort="updated">近期维护</button></div></label></div><div id="catalog"></div></section>
</main></div><nav class="mobile-nav"><a href="/client">发现</a><a href="/">数据工作台</a></nav>
<script>
const el=id=>document.getElementById(id), isClient=location.pathname==='/client';let tasks=[],workers=[],page=0,tab='tasks',repos=[],sort='catalog',requestId=crypto.randomUUID();
const labels={queued:'等待处理',running:'正在执行',succeeded:'已完成',failed:'执行失败',cancelled:'已取消'},types={repository:'公开项目',collection:'公开集合',process:'批量处理',import:'数据导入'};
function element(tag,text,className){const item=document.createElement(tag);if(text!==undefined)item.textContent=text;if(className)item.className=className;return item}
function time(value){return value?new Date(value).toLocaleString('zh-CN',{hour12:false}):'—'}
async function api(path,options={}){const headers={...options.headers};if(el('token').value)headers.Authorization='Bearer '+el('token').value;const response=await fetch('/api/platform/'+path,{...options,headers});const data=await response.json();if(!response.ok){const error=new Error(data.error||'请求失败');error.status=response.status;throw error}return data}
function empty(title,description,action){const box=element('div',undefined,'empty');box.append(element('strong',title),element('p',description));if(action){const button=element('button','重试');button.onclick=refresh;box.append(button)}return box}
function renderTasks(){const rows=tab==='workers'?workers:tasks.filter(t=>(!el('state').value||t.state===el('state').value)&&JSON.stringify([t.target,t.id,t.owner]).toLowerCase().includes(el('search').value.toLowerCase()));const size=Number(el('page-size').value);page=Math.min(page,Math.max(0,Math.ceil(rows.length/size)-1));const region=el('data-region');region.replaceChildren();el('total').textContent=rows.length+' 项';el('page-caption').textContent=rows.length?'第 '+(page+1)+' 页，共 '+Math.ceil(rows.length/size)+' 页':'0 项';el('previous').disabled=page===0;el('next').disabled=(page+1)*size>=rows.length;
if(!rows.length){region.append(empty(tab==='workers'?'没有在线采集进程':'没有匹配的任务',tab==='workers'?'在 Ubuntu 主机启动 worker 后，在线租约会显示在这里。':'调整筛选条件，或创建一个公开项目采集任务。'));return}
const wrap=element('div',undefined,'table-wrap'),table=element('table'),thead=element('thead'),head=element('tr');for(const name of tab==='workers'?['执行主机','进程标识','启动时间']:['任务对象','类型','状态','尝试次数','执行主机','创建时间','详情']){const th=element('th',name);if(name==='尝试次数')th.className='number';if(name.includes('时间'))th.className='time';head.append(th)}thead.append(head);table.append(thead);const body=element('tbody');
for(const item of rows.slice(page*size,(page+1)*size)){const row=element('tr');if(tab==='workers'){row.append(element('td',item.host),element('td',item.workerId),element('td',time(item.startedAt),'time'))}else{row.append(element('td',item.target),element('td',types[item.type]||item.type));const state=element('td');state.append(element('span',labels[item.state]||item.state,'badge '+item.state));row.append(state,element('td',String(item.attempt),'number'),element('td',item.owner||'—'),element('td',time(item.createdAt),'time'));const detail=element('td'),details=element('details'),summary=element('summary','查看');details.append(summary,element('pre',JSON.stringify(item,null,2)));details.className='row-detail';detail.append(details);row.append(detail)}body.append(row)}table.append(body);wrap.append(table);region.append(wrap)}
function renderCatalog(){const target=el('catalog');target.replaceChildren();const query=el('project-search').value.toLowerCase();let items=repos.filter(r=>JSON.stringify([r.fullName,r.description,r.topics]).toLowerCase().includes(query));if(sort==='stars')items.sort((a,b)=>(b.starCount||0)-(a.starCount||0));if(sort==='updated')items.sort((a,b)=>(b.pushedAt||0)-(a.pushedAt||0));if(!items.length){target.append(empty('暂无可展示项目','服务端完成公开项目采集后显示在这里；也可以缩小搜索条件。'));return}const grid=element('div',undefined,'catalog');for(const repo of items){const card=element('article',undefined,'project');card.append(element('span',repo.owner,'owner'),element('h2',repo.name),element('p',repo.description||'项目暂无简介'));const tags=element('div',undefined,'tags');if(repo.primaryLanguage)tags.append(element('span',repo.primaryLanguage,'tag'));for(const topic of (repo.topics||[]).slice(0,4))tags.append(element('span',topic,'tag'));card.append(tags);const details=element('details');details.append(element('summary','项目证据'));const dl=element('dl');for(const [key,value]of [['许可证',repo.licenseSpdx||'未识别'],['最近推送',time(repo.pushedAt)],['采集时间',time(repo.observedAt)],['质量评估','尚未计算，不以 Star 代替质量']])dl.append(element('dt',key),element('dd',value));details.append(dl);card.append(details);const foot=element('footer');foot.append(element('span','Star '+(repo.starCount??'未知')));const link=element('a','查看 GitHub ↗');if(/^https:\/\/github\.com\//.test(repo.htmlUrl||'')){link.href=repo.htmlUrl;link.target='_blank';link.rel='noopener noreferrer'}foot.append(link);card.append(foot);grid.append(card)}target.append(grid)}
async function refresh(){el('refresh').disabled=true;el('status').textContent='正在读取数据…';try{if(isClient){const data=await api('repositories');repos=data.items;renderCatalog()}else{const data=await api('status');tasks=data.tasks;workers=data.workers;el('workers').textContent=workers.length;for(const state of ['queued','running','succeeded'])el(state).textContent=tasks.filter(t=>t.state===state).length;const mode=data.deploymentMode;el('cluster-mode').textContent=mode==='ha-quorum'?'已配置多数派仲裁模式；在线采集租约不等于全部 Hadoop 节点健康，故障切换仍需按部署记录验收。':mode==='two-host-limited'?'两主机受限模式：支持工作任务重试，控制面不具备完整自动切换条件。':'本机开发模式：这里的进程与数据不代表多物理主机高可用验收。';el('cluster-mode').className='notice '+(mode==='ha-quorum'?'':'warning');renderTasks()}el('status').textContent='更新时间 '+new Date().toLocaleTimeString('zh-CN')}catch(error){el('status').textContent=error.message;const target=isClient?el('catalog'):el('data-region');target.replaceChildren(empty(error.status===401?'访问受限':'数据读取失败',error.message,true));if(!isClient)for(const id of ['workers','queued','running','succeeded'])el(id).textContent='—'}finally{el('refresh').disabled=false}}
el('auth').onsubmit=event=>{event.preventDefault();refresh()};el('search').oninput=()=>{page=0;renderTasks()};el('state').onchange=()=>{page=0;renderTasks()};el('page-size').onchange=()=>{page=0;renderTasks()};el('previous').onclick=()=>{page--;renderTasks()};el('next').onclick=()=>{page++;renderTasks()};el('project-search').oninput=renderCatalog;
el('collect').onsubmit=async event=>{event.preventDefault();el('submit').disabled=true;try{const result=await api('tasks',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({target:el('repository').value.trim(),requestId})});el('submit-status').textContent='已创建任务 '+result.taskId.slice(0,12)+'，由在线 worker 处理';requestId=crypto.randomUUID();el('repository').value='';await refresh()}catch(error){el('submit-status').textContent=error.message}finally{el('submit').disabled=false}};
for(const button of document.querySelectorAll('[data-sort]'))button.onclick=()=>{sort=button.dataset.sort;document.querySelectorAll('[data-sort]').forEach(b=>b.classList.toggle('selected',b===button));renderCatalog()};
if(isClient){el('auth').querySelector('label').hidden=true;document.querySelector('.side-foot small').textContent='开源项目目录';const workspaceLink=document.querySelector('.side-foot a');workspaceLink.href='/';workspaceLink.textContent='数据工作台 ↗';el('admin').hidden=true;el('client').hidden=false;el('title').textContent='发现值得使用的开源项目';el('eyebrow').textContent='OPEN SOURCE DISCOVERY';el('brand-caption').textContent='项目发现';document.title='HappyGit 项目发现'}
for(const [key,label]of (isClient?[['catalog','项目目录']]:[['tasks','采集与处理'],['workers','执行主机']])){const button=element('button',label,key===tab||isClient?'active':'');button.onclick=()=>{tab=key;page=0;document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b===button));el('section-title').textContent=key==='workers'?'在线采集进程':'任务列表';renderTasks()};el('nav').append(button)}refresh();
</script></body></html>
