name: Build & Release Android APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install Client Dependencies
        run: |
          cd client
          npm install

      - name: Build Web Assets
        run: |
          cd client
          npm run build

      - name: Sync Capacitor Android
        run: |
          cd client
          npx cap sync android

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build Android Debug APK
        run: |
          cd client/android
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Organize Output APK
        run: |
          mkdir -p output
          cp client/android/app/build/outputs/apk/debug/app-debug.apk output/HappyGit-v1.0.0.apk

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: HappyGit-v1.0.0-Android-APK
          path: output/HappyGit-v1.0.0.apk
          if-no-files-found: error

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.0-alpha
          name: "HappyGit v1.0.0 跨平台客户端预发布 (含 Android APK)"
          body: |
            ### 📱 HappyGit v1.0.0 客户端下载
            
            - **Android 安装包**: 点击下方 `HappyGit-v1.0.0.apk` 即可直接在安卓手机上安装体验。
            - **Windows 桌面端**: 详见仓库内 `client/release/HappyGit-win-x64/HappyGit.exe`。
            
            #### 🌟 本版功能特色：
            - GitHub 账号登录与公开项目画像同步
            - 类抖音风格个人主页与多维技术标签展示
            - 浏览历史与 Star 记录管理
            - 热门项目卡片流预告
          files: output/HappyGit-v1.0.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
