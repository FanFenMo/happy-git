name: Build & Release Android APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install Client Dependencies
        run: |
          cd client
          npm ci

      - name: Build Web Assets
        env:
          VITE_API_BASE_URL: ${{ vars.HAPPYGIT_API_BASE_URL }}
        run: |
          cd client
          npm run build:release

      - name: Sync Capacitor Android
        run: |
          cd client
          npx cap sync android

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build Android Debug APK
        run: |
          cd client/android
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Resolve Client Version
        id: meta
        run: |
          VER=$(node -p "require('./client/package.json').version")
          echo "version=$VER" >> "$GITHUB_OUTPUT"

      - name: Organize Output APK & Checksum
        run: |
          mkdir -p output
          APK_NAME="HappyGit-v${{ steps.meta.outputs.version }}.apk"
          cp client/android/app/build/outputs/apk/debug/app-debug.apk "output/${APK_NAME}"
          node client/scripts/generate-release-manifest.mjs \
            --platform android \
            --artifact "output/${APK_NAME}" \
            --output "output/release-manifest-android.json" \
            --build-command "cd client && npm run build:release && npx cap sync android && cd android && ./gradlew assembleDebug --no-daemon"

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: HappyGit-v${{ steps.meta.outputs.version }}-Android-APK
          path: |
            output/HappyGit-v${{ steps.meta.outputs.version }}.apk
            output/HappyGit-v${{ steps.meta.outputs.version }}.apk.sha256
            output/release-manifest-android.json
          if-no-files-found: error

  build-windows:
    name: Build Windows Client
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install Client Dependencies
        working-directory: client
        run: npm ci

      - name: Build Windows Client
        working-directory: client
        env:
          VITE_API_BASE_URL: ${{ vars.HAPPYGIT_API_BASE_URL }}
        run: npm run build:win

      - name: Resolve Client Version & Organize Windows Archive
        id: win_meta
        shell: pwsh
        run: |
          $ver = (Get-Content client/package.json -Raw | ConvertFrom-Json).version
          "version=$ver" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          New-Item -ItemType Directory -Force -Path output | Out-Null
          $zipPath = "output/HappyGit-v$ver-win-x64.zip"
          Compress-Archive -LiteralPath client/release/HappyGit-win-x64 -DestinationPath $zipPath -Force
          node client/scripts/generate-release-manifest.mjs `
            --platform windows `
            --artifact $zipPath `
            --output output/release-manifest-windows.json `
            --build-command "cd client && npm run build:win"

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HappyGit-v${{ steps.win_meta.outputs.version }}-Windows
          path: |
            output/HappyGit-v${{ steps.win_meta.outputs.version }}-win-x64.zip
            output/HappyGit-v${{ steps.win_meta.outputs.version }}-win-x64.zip.sha256
            output/release-manifest-windows.json
          if-no-files-found: error

  publish:
    name: Publish Clients
    needs: [build-android, build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Resolve Client Version
        id: pub_meta
        run: |
          VER=$(node -p "require('./client/package.json').version")
          echo "version=$VER" >> "$GITHUB_OUTPUT"

      - name: Download Client Artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: HappyGit-v${{ steps.pub_meta.outputs.version }}-*
          path: output
          merge-multiple: true

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.pub_meta.outputs.version }}
          name: "HappyGit v${{ steps.pub_meta.outputs.version }} 跨平台客户端发布 (Windows + Android)"
          body: |
            ### 📱 HappyGit v${{ steps.pub_meta.outputs.version }} 客户端下载

            - **Android 安装包**：下载 `HappyGit-v${{ steps.pub_meta.outputs.version }}.apk` 及对应 `.sha256` 校验文件（`versionCode=3`，覆盖旧版升级保留本地 SQLite 数据）。
            - **Windows 桌面端**：下载 `HappyGit-v${{ steps.pub_meta.outputs.version }}-win-x64.zip` 及对应 `.sha256` 校验文件，解压后运行 `HappyGit.exe`。
            - 公开云端服务地址已随安装包预置（无内置密钥），普通用户无需手动填写 API 地址或应用凭据；未绑定云端时可独立使用本地 GitHub 网页会话与本地推荐。

            #### 🌟 本版功能特色：
            - 本地 GitHub 网页会话 + 可选云端应用会话（`/api/v2`）双会话隔离与账号一致性校验
            - SQLite 无损升级、按次有效浏览去重上传队列与 `accepted / exported / processed` 三水位展示
            - 同构 8192 维特征空间摘要校验、云端画像驱动有界搜索（最多 4 查询 / 8 页）与近期增量接续排序
            - 个人画像多状态真实反馈、群体分布页签（`<10` 抑制）与已隐藏推荐恢复管理
          files: |
            output/HappyGit-v${{ steps.pub_meta.outputs.version }}.apk
            output/HappyGit-v${{ steps.pub_meta.outputs.version }}.apk.sha256
            output/release-manifest-android.json
            output/HappyGit-v${{ steps.pub_meta.outputs.version }}-win-x64.zip
            output/HappyGit-v${{ steps.pub_meta.outputs.version }}-win-x64.zip.sha256
            output/release-manifest-windows.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
